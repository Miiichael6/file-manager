# Web Dirwise (site/, Astro) na GitHub Pages. Pages musí mít v nastavení repa zdroj „GitHub Actions“.
# Adresa a base se berou z actions/configure-pages – sedí na <owner>.github.io/<repo>/ i na vlastní doménu.
# Na push běží jen s proměnnou repa PAGES_ENABLED=true (nastavit po zapnutí Pages), jinak by configure-pages
# padal; ručně (workflow_dispatch) vždy – i po vydání (nová verze a velikost v hero). Trigger release
# nejde: prostředí github-pages povoluje nasazení jen z výchozí větve, ne z tagu.
# Denně (cron) kvůli seznamu nápadů z GitHub Discussions na /ideas/ (site/src/lib/ideas.ts). GitHub plánované
# workflow ve veřejném repu vypne po 60 dnech bez commitů – pak ho stačí znovu zapnout v záložce Actions.
name: Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "docs/brand/**"
      - "README.md"
      - "README.cs.md"
      - "package.json"
      - "app-icon.png"
      - "src-tauri/icons/icon.ico"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GraphQL: nápady z kategorie Ideas (site/src/lib/ideas.ts)
      discussions: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # npm run build = prepare (OG obrázek, favicony) + astro build + kontrola zakázaných slov
      - run: npm run build
        env:
          # velikost instalátoru z GitHub API (site/src/lib/release.ts) bez limitu anonymních požadavků,
          # nápady z Discussions přes GraphQL (bez tokenu nejde – stránka by byla bez seznamu)
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
